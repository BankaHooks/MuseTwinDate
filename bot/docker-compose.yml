version: '3.8'
services:
  bot:
    build: .
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-muse_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - PAYMENT_PROVIDER_TOKEN=${PAYMENT_PROVIDER_TOKEN}
      - ADMIN_IDS=${ADMIN_IDS}
      - USE_WEBHOOK=False
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-muse_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Не публикуем 5432 на хост — доступ к БД только из внутренней docker-сети.
    # Если нужен доступ снаружи для отладки, используйте "127.0.0.1:5432:5432".
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    # Аналогично не публикуем 6379 наружу.
    restart: unless-stopped
volumes:
  pg_data: