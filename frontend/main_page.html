<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuseTwin</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <header class="header">
        <div class="Header-box">
            <div class="left-part">
                <button class="Filters-Button">
                    Filters
                </button>
            </div>
            <div class="middle-part">
                <h2 class="App-name">
                    MuseTwin
                </h2>            
            </div>
            <div class="right-part">
                <button class="Report-Button">
                    <img src="images/icons/danger.svg" alt="" class="report-icon">
                    Report
                </button>
            </div>
        </div>
    </header>

    <div class="Main-box">
        <div class="User-photo-card">
            <img src="images/UserCard.png" alt="User-photo" class="Photo-of-User">
            <div class="Box-for-text">
                <h4 class="User-name">Igor Colomoyski, 27</h4>
            </div>
        </div>
        <div class="side-bar">
            <div class="sidebar-buttons">
                <img src="images/UserPhoto.png" alt="User-Photo" class="sidebar-user_photo">
                <button class="Like-button">
                    Like
                </button>
                <button class="Chat-button">
                    Chat
                </button>
                <button class="Skip-button">
                    Skip
                </button>
            </div>
        </div>
        <div class="Users-music-stats">
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Ex saepe veniam, molestiae eum magnam sint. Sunt dicta, sapiente maiores voluptate perspiciatis maxime enim praesentium eos ullam consequuntur quisquam vero nesciunt.
        </div>
    </div>

    <footer class="Choose-page-box">
        <div class="footer-buttons">
            <button class="Main-page">
                Main
            </button>
            <button class="Chats-page">
                Chats
            </button>
            <button class="Profile-page">
                Profile
            </button>
        </div>
    </footer>
</body>
</html>
